name: Update FPL dashboard

on:
  schedule:
    # Every day at 07:00 and 17:00 UTC (08:00 / 18:00 Lagos).
    # The evening run is the one that catches Friday-evening deadlines.
    - cron: "0 7,17 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      wildcard:
        description: "Rebuild the squad from scratch (ignore your current team)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build projections and dashboard data
        env:
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
          FPL_MINUTE_OVERRIDES: ${{ vars.FPL_MINUTE_OVERRIDES }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -m fpl.build --notify \
            ${{ inputs.wildcard && '--wildcard' || '' }}

      - name: Commit refreshed data
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add docs/data.json docs/fpl-deadlines.ics
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%FT%TZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
